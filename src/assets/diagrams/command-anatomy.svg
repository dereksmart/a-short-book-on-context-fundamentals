<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of a command</title>
  <desc id="desc">A command split into job, anchors, and return.</desc>
  <defs>
    <style>
      .bg { fill: #f7f3ea; }
      .ink { fill: #1f2933; }
      .muted { fill: #69727a; }
      .paper { fill: #fffaf0; stroke: #1f2933; stroke-width: 3; rx: 12; }
      .slot { stroke: #1f2933; stroke-width: 2.5; rx: 9; }
      .job { fill: #d9e7e2; }
      .anchors { fill: #eee3b8; }
      .return { fill: #efd8cc; }
      .rule { stroke: #69727a; stroke-width: 5; stroke-linecap: round; }
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 38px; font-weight: 700; }
      .label { font-size: 30px; font-weight: 700; }
      .small { font-size: 21px; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="675"/>
  <text class="title ink" x="86" y="92">Anatomy of a Command</text>
  <text class="small muted" x="88" y="128">A useful prompt says what to do, what to respect, and what to return.</text>

  <rect class="paper" x="260" y="168" width="680" height="400"/>
  <rect class="slot job" x="314" y="220" width="572" height="82"/>
  <rect class="slot anchors" x="314" y="326" width="572" height="82"/>
  <rect class="slot return" x="314" y="432" width="572" height="82"/>

  <text class="label ink" x="350" y="272">Job</text>
  <text class="label ink" x="350" y="378">Anchors</text>
  <text class="label ink" x="350" y="484">Return</text>

  <line class="rule" x1="535" y1="252" x2="824" y2="252"/>
  <line class="rule" x1="535" y1="358" x2="794" y2="358"/>
  <line class="rule" x1="535" y1="464" x2="842" y2="464"/>
  <line class="rule" x1="535" y1="492" x2="720" y2="492"/>
</svg>
