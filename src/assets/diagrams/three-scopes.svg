<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Three scopes of memory</title>
  <desc id="desc">A diagram comparing project scope, user scope, and auto memory.</desc>
  <defs>
    <style>
      .bg { fill: #f7f3ea; }
      .ink { fill: #1f2933; }
      .muted { fill: #69727a; }
      .card { stroke: #1f2933; stroke-width: 3; rx: 12; }
      .a { fill: #d9e7e2; }
      .b { fill: #eee3b8; }
      .c { fill: #efd8cc; }
      .line { stroke: #69727a; stroke-width: 5; stroke-linecap: round; }
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 38px; font-weight: 700; }
      .label { font-size: 27px; font-weight: 700; }
      .small { font-size: 21px; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="675"/>
  <text class="title ink" x="86" y="92">Three Scopes</text>
  <text class="small muted" x="88" y="128">Different memories belong to different owners.</text>

  <rect class="card a" x="86" y="210" width="300" height="300"/>
  <rect class="card b" x="450" y="210" width="300" height="300"/>
  <rect class="card c" x="814" y="210" width="300" height="300"/>

  <text class="label ink" x="142" y="272">Project</text>
  <text class="small ink" x="142" y="322">Shared rules</text>
  <text class="small ink" x="142" y="360">Repository norms</text>
  <text class="small ink" x="142" y="398">Team decisions</text>
  <line class="line" x1="142" y1="440" x2="310" y2="440"/>

  <text class="label ink" x="506" y="272">User</text>
  <text class="small ink" x="506" y="322">Preferences</text>
  <text class="small ink" x="506" y="360">Personal defaults</text>
  <text class="small ink" x="506" y="398">Stable habits</text>
  <line class="line" x1="506" y1="440" x2="674" y2="440"/>

  <text class="label ink" x="870" y="272">Auto</text>
  <text class="small ink" x="870" y="322">Observed patterns</text>
  <text class="small ink" x="870" y="360">Inferred facts</text>
  <text class="small ink" x="870" y="398">Needs review</text>
  <line class="line" x1="870" y1="440" x2="1038" y2="440"/>

  <text class="small muted" x="128" y="562">write deliberately</text>
  <text class="small muted" x="498" y="562">carry carefully</text>
  <text class="small muted" x="868" y="562">audit often</text>
</svg>
