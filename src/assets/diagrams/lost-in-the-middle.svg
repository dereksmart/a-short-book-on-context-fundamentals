<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Lost in the middle</title>
  <desc id="desc">A U-shaped curve showing stronger attention near the beginning and end of a context window, with weaker attention in the middle.</desc>
  <defs>
    <style>
      .bg { fill: #f7f3ea; }
      .ink { fill: #1f2933; }
      .muted { fill: #69727a; }
      .axis { stroke: #1f2933; stroke-width: 3; fill: none; stroke-linecap: round; }
      .grid { stroke: #d8cfc2; stroke-width: 2; fill: none; }
      .curve { stroke: #487c7b; stroke-width: 9; fill: none; stroke-linecap: round; }
      .dot { fill: #b56b4b; stroke: #1f2933; stroke-width: 3; }
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 38px; font-weight: 700; }
      .label { font-size: 25px; font-weight: 650; }
      .small { font-size: 20px; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="675"/>
  <text class="title ink" x="92" y="92">Lost in the Middle</text>
  <text class="small muted" x="94" y="128">A long window is not the same thing as even attention.</text>

  <line class="axis" x1="150" y1="540" x2="1050" y2="540"/>
  <line class="axis" x1="150" y1="540" x2="150" y2="160"/>
  <line class="grid" x1="150" y1="420" x2="1050" y2="420"/>
  <line class="grid" x1="150" y1="300" x2="1050" y2="300"/>
  <line class="grid" x1="150" y1="180" x2="1050" y2="180"/>

  <path class="curve" d="M190 205 C330 250 390 455 600 455 C810 455 870 250 1010 205"/>
  <circle class="dot" cx="600" cy="455" r="13"/>

  <text class="label ink" x="172" y="588">front</text>
  <text class="label ink" x="558" y="588">middle</text>
  <text class="label ink" x="990" y="588">end</text>
  <text class="small muted" x="52" y="180" transform="rotate(-90 52 180)">retrieval strength</text>
  <text class="small muted" x="482" y="506">dim zone</text>
  <text class="small muted" x="226" y="242">anchor early</text>
  <text class="small muted" x="852" y="242">repeat late</text>
</svg>
