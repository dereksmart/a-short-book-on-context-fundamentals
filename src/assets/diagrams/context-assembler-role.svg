<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">The context assembler</title>
  <desc id="desc">Four streams of work feeding into one useful context packet.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#1f2933"/>
    </marker>
    <style>
      .bg { fill: #f7f3ea; }
      .ink { fill: #1f2933; }
      .muted { fill: #69727a; }
      .card { fill: #fffaf0; stroke: #1f2933; stroke-width: 3; rx: 12; }
      .a { fill: #d9e7e2; }
      .b { fill: #eee3b8; }
      .c { fill: #efd8cc; }
      .d { fill: #d9e1ea; }
      .arrow { stroke: #1f2933; stroke-width: 3; fill: none; stroke-linecap: round; marker-end: url(#arrow); }
      .rule { stroke: #69727a; stroke-width: 5; stroke-linecap: round; }
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 38px; font-weight: 700; }
      .label { font-size: 25px; font-weight: 700; }
      .small { font-size: 21px; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="675"/>
  <text class="title ink" x="86" y="92">The Context Assembler</text>
  <text class="small muted" x="88" y="128">Someone has to turn scattered knowledge into usable context.</text>

  <rect class="card a" x="96" y="190" width="250" height="76"/>
  <rect class="card b" x="96" y="292" width="250" height="76"/>
  <rect class="card c" x="96" y="394" width="250" height="76"/>
  <rect class="card d" x="96" y="496" width="250" height="76"/>
  <text class="label ink" x="136" y="239">Authorship</text>
  <text class="label ink" x="136" y="341">Curation</text>
  <text class="label ink" x="136" y="443">Integration</text>
  <text class="label ink" x="136" y="545">Diagnosis</text>

  <rect class="card" x="772" y="244" width="310" height="250"/>
  <text class="label ink" x="824" y="304">Useful Context</text>
  <text class="label ink" x="866" y="340">Packet</text>
  <line class="rule" x1="832" y1="388" x2="1014" y2="388"/>
  <line class="rule" x1="832" y1="425" x2="982" y2="425"/>

  <path class="arrow" d="M346 228 C520 228 560 300 762 310"/>
  <path class="arrow" d="M346 330 C520 330 560 335 762 350"/>
  <path class="arrow" d="M346 432 C520 432 560 402 762 390"/>
  <path class="arrow" d="M346 534 C520 534 560 464 762 430"/>
</svg>
