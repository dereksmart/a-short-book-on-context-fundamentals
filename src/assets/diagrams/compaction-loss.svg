<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Compaction loses texture</title>
  <desc id="desc">A sequence of cards showing a full session becoming a summary and then a summary of a summary, with details dropping away.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#1f2933"/>
    </marker>
    <style>
      .bg { fill: #f7f3ea; }
      .ink { fill: #1f2933; }
      .muted { fill: #69727a; }
      .card { fill: #fffaf0; stroke: #1f2933; stroke-width: 3; rx: 10; }
      .line { stroke: #1f2933; stroke-width: 3; fill: none; stroke-linecap: round; marker-end: url(#arrow); }
      .rule { stroke: #69727a; stroke-width: 5; stroke-linecap: round; }
      .lost { fill: #b56b4b; opacity: .78; }
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 38px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 650; }
      .small { font-size: 20px; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="675"/>
  <text class="title ink" x="86" y="92">Compaction Loses Texture</text>
  <text class="small muted" x="88" y="128">Summaries preserve direction better than detail.</text>

  <rect class="card" x="86" y="210" width="260" height="270"/>
  <rect class="card" x="470" y="230" width="260" height="230"/>
  <rect class="card" x="854" y="255" width="260" height="180"/>

  <text class="label ink" x="120" y="180">full session</text>
  <text class="label ink" x="520" y="180">summary</text>
  <text class="label ink" x="880" y="180">summary again</text>

  <g>
    <line class="rule" x1="126" y1="252" x2="302" y2="252"/>
    <line class="rule" x1="126" y1="288" x2="278" y2="288"/>
    <line class="rule" x1="126" y1="324" x2="315" y2="324"/>
    <line class="rule" x1="126" y1="360" x2="246" y2="360"/>
    <line class="rule" x1="126" y1="396" x2="304" y2="396"/>
    <line class="rule" x1="126" y1="432" x2="266" y2="432"/>
  </g>
  <g>
    <line class="rule" x1="510" y1="278" x2="674" y2="278"/>
    <line class="rule" x1="510" y1="318" x2="650" y2="318"/>
    <line class="rule" x1="510" y1="358" x2="690" y2="358"/>
    <line class="rule" x1="510" y1="398" x2="630" y2="398"/>
  </g>
  <g>
    <line class="rule" x1="894" y1="305" x2="1044" y2="305"/>
    <line class="rule" x1="894" y1="352" x2="1016" y2="352"/>
    <line class="rule" x1="894" y1="399" x2="1060" y2="399"/>
  </g>

  <path class="line" d="M366 344 H444"/>
  <path class="line" d="M750 344 H828"/>
  <circle class="lost" cx="410" cy="496" r="8"/>
  <circle class="lost" cx="438" cy="530" r="6"/>
  <circle class="lost" cx="778" cy="480" r="8"/>
  <circle class="lost" cx="808" cy="515" r="6"/>
  <text class="small muted" x="404" y="570">details fall out first</text>
</svg>
